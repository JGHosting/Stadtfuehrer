name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'   # jede Nacht: fehlende Gemini-Audios nachproduzieren
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: KI-Audios aus dem Cache holen
        uses: actions/cache@v4
        with:
          path: audio
          key: audio-${{ github.run_id }}
          restore-keys: audio-
      - name: KI-Audios erzeugen (nur neue oder geänderte Texte)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Nachts, per Hand gestartet oder mit „[audio]“ in der Commit-Nachricht: lange Audio-Erzeugung, sonst kurz
          GEMINI_BUDGET_S: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[audio]')) && '2400' || '120' }}
          GEMINI_MAX_REQUESTS: '150'
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install --quiet "edge-tts>=7.2"
          node tools/texts.mjs > texts.json
          python tools/tts.py texts.json audio
          ls audio | wc -l
          du -sh audio
      - name: Audio-Status ins Repo schreiben (Branch audio-status, zur Fehlersuche)
        if: always()
        run: |
          mkdir -p /tmp/st && cp audio/status.json /tmp/st/ 2>/dev/null || echo '{}' > /tmp/st/status.json
          for f in audio/manifest-*.json; do python3 -c "import json,sys; m=json.load(open(sys.argv[1])); print(sys.argv[1], {k:len(v) for k,v in m['voices'].items()})" "$f"; done > /tmp/st/manifests.txt || true
          cd /tmp/st && git init -q && git checkout -q -b audio-status
          git -c user.name=github-actions -c user.email=actions@github.com add . && git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "Audio-Status $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" audio-status
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
