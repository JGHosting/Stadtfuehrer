<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#4C8A6F"/><stop offset=".55" stop-color="#2E5E4B"/><stop offset="1" stop-color="#1D4134"/></linearGradient>
 <radialGradient id="glow" cx=".3" cy=".18" r=".7"><stop offset="0" stop-color="#9FD8BC" stop-opacity=".45"/><stop offset="1" stop-color="#9FD8BC" stop-opacity="0"/></radialGradient>
 <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".92"/><stop offset=".5" stop-color="#F4EFE6" stop-opacity=".62"/><stop offset="1" stop-color="#E9F3EE" stop-opacity=".48"/></linearGradient>
 <radialGradient id="red" cx=".38" cy=".3" r=".75"><stop offset="0" stop-color="#FF8C7C"/><stop offset=".6" stop-color="#D9473A"/><stop offset="1" stop-color="#A9281F"/></radialGradient>
 <filter id="shine" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="b"/>
  <feSpecularLighting in="b" surfaceScale="7" specularConstant="1.05" specularExponent="22" lighting-color="#ffffff" result="s"><fePointLight x="260" y="40" z="420"/></feSpecularLighting>
  <feComposite in="s" in2="SourceAlpha" operator="in" result="si"/>
  <feComposite in="SourceGraphic" in2="si" operator="arithmetic" k1="0" k2="1" k3=".55" k4="0"/>
 </filter>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
 <filter id="blur6"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/><rect width="1024" height="1024" fill="url(#glow)"/>
<!-- Schatten -->
<g transform="translate(0 26)" opacity=".38" filter="url(#shadow)"><path d="M250 770 H610 A125 125 0 0 0 610 520 H414 A125 125 0 0 1 414 270 H690" fill="none" stroke="#0B1F17" stroke-width="112" stroke-linecap="round"/><circle cx="760" cy="270" r="92" fill="#0B1F17"/></g>
<!-- Glas-Weg -->
<g filter="url(#shine)"><path d="M250 770 H610 A125 125 0 0 0 610 520 H414 A125 125 0 0 1 414 270 H690" fill="none" stroke="url(#tube)" stroke-width="112" stroke-linecap="round"/></g>
<!-- Lichtkante oben -->
<path d="M250 770 H610 A125 125 0 0 0 610 520 H414 A125 125 0 0 1 414 270 H690" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="10" stroke-linecap="round" transform="translate(0 -40)" filter="url(#blur6)" clip-path="url(#sclip)"/>
<clipPath id="sclip"><path d="M250 770 H610 A125 125 0 0 0 610 520 H414 A125 125 0 0 1 414 270 H690" fill="none" stroke="#000" stroke-width="112" stroke-linecap="round"/></clipPath>
<!-- Ziel -->
<g filter="url(#shine)"><circle cx="760" cy="270" r="92" fill="url(#red)"/></g>
<circle cx="760" cy="270" r="92" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="5"/>
<circle cx="760" cy="270" r="34" fill="#FFF8F0" fill-opacity=".95"/>
<ellipse cx="728" cy="214" rx="38" ry="16" fill="#fff" fill-opacity=".45" transform="rotate(-25 728 214)" filter="url(#blur6)"/>
</svg>